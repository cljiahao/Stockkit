# pnpm-workspace.yaml — project-level pnpm 11 settings.
# Auth/registry settings belong in .npmrc; all other settings belong here.

# Block git-URL, tarball, and local-path dependencies.
# Primary mitigation against dependency confusion and supply-chain attacks.
blockExoticSubdeps: true

# Explicitly allowlist packages permitted to run install-time build scripts.
# pnpm 11 blocks all install scripts by default; add native packages here as needed.
allowBuilds:
  '@merqo/ui@https://codeload.github.com/merqo-io/merqo-ui/tar.gz/d4f4f3c49e5426aa6c7cf276afdc19d0be36c17e': true
  'unrs-resolver@1.12.2': true
  sharp: false

overrides:
  sharp@<0.35.0: '>=0.35.0' # patches high-severity libvips CVEs (CVE-2026-33327/33328/35590/35591)
  postcss@<8.5.23: '>=8.5.23' # patches incomplete fix of the sourceMappingURL file-read advisory (GHSA-fxqj-rqcc-2cmp) — the earlier 8.5.12 pin only closed GHSA-6g55-p6wh-862q, not this follow-up
  nanoid@<3.3.17: '>=3.3.17' # patches high-severity DoS via GHSA-2v37-7h3g-55p8

  undici@<7.29.1: '>=7.29.1 <8'
  fast-uri@<4.1.5: '>=4.1.5 <5'
  js-yaml@<4.3.1: '>=4.3.1 <5'
  js-yaml@>=5.0.0 <5.4.1: '>=5.4.1 <6'
  brace-expansion@<1.1.21: '>=1.1.21 <2'
  brace-expansion@>=2.0.0 <2.1.4: '>=2.1.4 <3'
  brace-expansion@>=3.0.0 <5.0.12: '>=5.0.12 <6'
  source-map-js@<1.2.2: '>=1.2.2 <2'
  postcss-selector-parser@<7.1.6: '>=7.1.6 <8'
  fast-copy@<4.1.0: '>=4.1.0 <5'
