# pnpm-workspace.yaml — project-level pnpm 11 settings.
# Auth/registry settings belong in .npmrc; all other settings belong here.

# Block git-URL, tarball, and local-path dependencies.
# Primary mitigation against dependency confusion and supply-chain attacks.
blockExoticSubdeps: true

# Explicitly allowlist packages permitted to run install-time build scripts.
# pnpm 11 blocks all install scripts by default; add native packages here as needed.
allowBuilds:
  '@merqo/ui': true # tsup prepare build must run, or dist/ never gets produced and every consuming type silently degrades to any
  '@merqo/ui@https://codeload.github.com/cljiahao/merqo-ui/tar.gz/f21529f389b49aeb56756108dbbc6cb6b147eaf6': true # blockExoticSubdeps forces this exact tarball-URL-keyed form for a git dependency's own allowBuilds entry, name-only isn't enough here (unlike the sibling kits, which don't set blockExoticSubdeps); URL updates on every @merqo/ui version bump (currently v0.10.1)
  sharp: true # Next.js image optimisation
  unrs-resolver: true # required by eslint-config-next resolver

overrides:
  sharp@<0.35.0: '>=0.35.0' # patches high-severity libvips CVEs (CVE-2026-33327/33328/35590/35591)
  postcss@<=8.5.11: '>=8.5.12' # patches high-severity arbitrary file read via sourceMappingURL (GHSA-6g55-p6wh-862q)
  nanoid@<3.3.17: '>=3.3.17' # patches high-severity DoS via GHSA-2v37-7h3g-55p8
